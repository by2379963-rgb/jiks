name: Build C++ EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MinGW
      uses: egor-tisin/setup-mingw-gh-action@v1
      with:
        version: '12.2.0'

    - name: Compile Application
      run: |
        windres resource.rc -O coff -o resource.o
        g++ -municode main.cpp resource.o -o WallpaperChanger.exe -mwindows

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: WallpaperChanger
        path: WallpaperChanger.exe
